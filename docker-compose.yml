# =============================================================================
# AI Engineering Lab - local infrastructure
#
# Milestone 1 starts ONLY PostgreSQL + pgvector.
# Qdrant, Redis and Chroma will be added later under Compose profiles so they never start
# unless you ask for them.
#
#   cp .env.example .env      # once
#   docker compose up -d      # start
#   docker compose ps         # status (wait for "healthy")
#   docker compose logs -f postgres
#   docker compose down       # stop (data is kept in the named volume)
#   docker compose down -v    # stop AND delete all data
# =============================================================================
name: ai-engineering-lab

services:
  postgres:
    # Pinned version: pgvector 0.8.7 on PostgreSQL 17. Pinning keeps every machine reproducible.
    image: pgvector/pgvector:0.8.7-pg17
    container_name: ai-lab-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ai_lab}
      POSTGRES_USER: ${POSTGRES_USER:-ai_lab}
      # No default: refuse to start without an explicit password from .env.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env (copy .env.example to .env)}
    ports:
      # Bound to localhost only: the database is not reachable from your network.
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Runs once, when the volume is first initialised: enables the pgvector extension.
      - ./infrastructure/docker/postgres/init:/docker-entrypoint-initdb.d:ro
      # Smoke-test script, run with: ./infrastructure/docker/postgres/verify-pgvector.sh
      - ./infrastructure/docker/postgres/verify:/verify:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  postgres-data:
    name: ai-lab-postgres-data
